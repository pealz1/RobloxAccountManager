[package]
name = "nova-ram"
version = "3.0.0"
edition = "2024"
rust-version = "1.89"
description = "Fast multi-account manager for Roblox on Windows"
license = "GPL-3.0-only"
repository = "https://github.com/pealz1/RobloxAccountManager"
publish = false

[[bin]]
name = "NovaRAM"
path = "src/main.rs"

[lib]
name = "nova"
path = "src/lib.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
egui_extras = { version = "0.36", features = ["image"] }
egui-phosphor = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
base64 = "0.22"
rand = "0.9"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
aes-gcm = "0.10"
argon2 = "0.5"
crypto_secretbox = "0.1"
roxmltree = "0.21"
zip = { version = "2", default-features = false, features = ["deflate"] }
tiny_http = "0.12"
tungstenite = "0.30"
tray-icon = "0.26"
rfd = "0.17"

[dependencies.windows-sys]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_Memory",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Com",
  "Win32_System_WindowsProgramming",
  "Win32_System_IO",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Wdk_System_SystemInformation",
  "Wdk_Foundation",
  "Wdk_System_Threading",
]

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
