name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z)"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      # Single statically-linked exe: no bundled DLLs to pick up from unrelated
      # tools on the runner (fixes upstream issue #80 / PR #81).
      - name: Build release
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Verify the executable launches
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/NovaRAM.exe"
          if (-not (Test-Path $exe)) { throw "Build output missing" }
          $out = & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "Executable did not run" }
          Write-Host "Launched: $out"

      - name: Stage release assets with checksum
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $version = $tag.TrimStart("v")
          New-Item -ItemType Directory -Force dist | Out-Null
          $asset = "dist/NovaRAM-v$version.exe"
          Copy-Item "target/x86_64-pc-windows-msvc/release/NovaRAM.exe" $asset
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
          "$hash  NovaRAM-v$version.exe" | Out-File -Encoding ascii "$asset.sha256"
          Write-Host "SHA-256: $hash"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Nova RAM ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/NovaRAM-v*.exe
            dist/NovaRAM-v*.exe.sha256
